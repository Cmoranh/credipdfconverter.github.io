<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editor de Carta de Libranza</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --txt: #e6e8ec; --muted: #9aa3b2; --accent: #8b1e3f; --accent2: #b02a4f;
    --ok: #2e7d5b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--txt);
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 20px;
  }
  main { display: grid; grid-template-columns: 1fr 420px; gap: 0; height: calc(100vh - 57px); }
  .preview { background: #23262e; display: flex; flex-direction: column; }
  .preview iframe { flex: 1; border: 0; background: #fff; }
  .side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px; }
  .drop {
    margin: 40px; border: 2px dashed var(--line); border-radius: var(--radius);
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--muted); cursor: pointer; text-align: center; padding: 30px;
  }
  .drop.hover { border-color: var(--accent2); color: var(--txt); background: #262a33; }
  .drop strong { color: var(--txt); font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .field input {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--txt); font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent2); }
  .field input.changed { border-color: var(--ok); background: #14231c; }
  .section-title { font-size: 12px; color: var(--accent2); font-weight: 700; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .actions { position: sticky; bottom: -18px; background: var(--panel); padding: 14px 0 4px; border-top: 1px solid var(--line); margin-top: 18px; }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 600; background: var(--accent); color: #fff;
  }
  button:hover { background: var(--accent2); }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--txt); margin-top: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Editor de Carta de Libranza</h1>
  <span class="badge">No almacena nada · procesa en memoria</span>
</header>

<main>
  <section class="preview">
    <div id="drop" class="drop">
      <strong>Arrastra un PDF aquí</strong>
      <span>o haz clic para seleccionar</span>
      <input id="fileInput" type="file" accept="application/pdf" hidden />
    </div>
    <iframe id="viewer" hidden></iframe>
  </section>

  <aside class="side">
    <div id="empty" class="empty">Sube un PDF para ver y editar sus campos.</div>
    <div id="form"></div>
    <div id="actions" class="actions" hidden>
      <button id="generate">Generar PDF con cambios</button>
      <button id="download" class="secondary" hidden>Descargar PDF</button>
      <button id="reset" class="secondary">Cargar otro PDF</button>
      <p class="hint">Solo se modifica el texto (el string). Fuente, tamaño, color y posición del resto se mantienen intactos.</p>
    </div>
  </aside>
</main>

<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let originalPdf = null;      // ArrayBuffer del PDF subido (se mantiene en el cliente)
let fields = [];            // campos detectados
let lastResultUrl = null;   // blob URL del PDF generado

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function showPdf(blobOrBuffer) {
  const blob = blobOrBuffer instanceof Blob ? blobOrBuffer : new Blob([blobOrBuffer], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  $("viewer").src = url + "#toolbar=1&view=FitH";
  $("viewer").hidden = false;
  $("drop").hidden = true;
}

async function handleFile(file) {
  if (!file || file.type !== "application/pdf") { toast("Selecciona un PDF válido."); return; }
  originalPdf = await file.arrayBuffer();
  showPdf(originalPdf.slice(0));

  const fd = new FormData();
  fd.append("file", new Blob([originalPdf], { type: "application/pdf" }), file.name);
  const res = await fetch("/api/extract", { method: "POST", body: fd });
  if (!res.ok) { toast("No se pudieron extraer los campos."); return; }
  const data = await res.json();
  fields = data.fields;
  renderForm();
}

function renderForm() {
  $("empty").hidden = true;
  $("actions").hidden = false;
  const form = $("form");
  form.innerHTML = "";
  fields.forEach((f) => {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const lab = document.createElement("label");
    lab.textContent = f.label;
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = f.value;
    inp.dataset.id = f.id;
    inp.dataset.original = f.value;
    inp.addEventListener("input", () => {
      inp.classList.toggle("changed", inp.value !== inp.dataset.original);
    });
    wrap.append(lab, inp);
    form.append(wrap);
  });
}

function collectChanges() {
  const changes = {};
  document.querySelectorAll("#form input").forEach((inp) => {
    if (inp.value !== inp.dataset.original) changes[inp.dataset.id] = inp.value;
  });
  return changes;
}

async function generate() {
  const changes = collectChanges();
  if (Object.keys(changes).length === 0) { toast("No hay cambios que aplicar."); return; }
  $("generate").disabled = true; $("generate").textContent = "Generando…";
  try {
    const fd = new FormData();
    fd.append("file", new Blob([originalPdf], { type: "application/pdf" }), "libranza.pdf");
    fd.append("changes", JSON.stringify(changes));
    const res = await fetch("/api/apply", { method: "POST", body: fd });
    if (!res.ok) { toast("Error al generar el PDF."); return; }
    const blob = await res.blob();
    if (lastResultUrl) URL.revokeObjectURL(lastResultUrl);
    lastResultUrl = URL.createObjectURL(blob);
    showPdf(blob);
    const dl = $("download");
    dl.hidden = false;
    dl.onclick = () => {
      const a = document.createElement("a");
      a.href = lastResultUrl; a.download = "libranza_modificada.pdf"; a.click();
    };
    toast("PDF generado. Revisa la vista previa.");
  } finally {
    $("generate").disabled = false; $("generate").textContent = "Generar PDF con cambios";
  }
}

function reset() {
  originalPdf = null; fields = [];
  $("viewer").hidden = true; $("viewer").src = "";
  $("drop").hidden = false;
  $("form").innerHTML = ""; $("empty").hidden = false;
  $("actions").hidden = true; $("download").hidden = true;
}

// Wiring
$("drop").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => handleFile(e.target.files[0]));
$("drop").addEventListener("dragover", (e) => { e.preventDefault(); $("drop").classList.add("hover"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("hover"));
$("drop").addEventListener("drop", (e) => {
  e.preventDefault(); $("drop").classList.remove("hover");
  handleFile(e.dataTransfer.files[0]);
});
$("generate").addEventListener("click", generate);
$("reset").addEventListener("click", reset);
</script>
</body>
</html>
